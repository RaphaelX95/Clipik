<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יצירת סרטון - קליפיק</title>
<link rel="stylesheet" href="/styles.css"><script>
const params = new URLSearchParams(location.search);
const template = {
  name: params.get('name') || 'סרטון מותאם',
  style: params.get('style') || 'UGC טבעי',
  duration: params.get('duration') || '15',
  hint: params.get('hint') || ''
};

document.getElementById('tplTitle').textContent = 'תבנית: ' + template.name;
document.getElementById('tplDesc').textContent = 'סגנון: ' + template.style + ' · ' + template.duration + ' שניות';
if(template.hint){
  const el = document.getElementById('templateHint');
  el.innerHTML = '<strong>💡 טיפ לפי התבנית</strong>' + template.hint;
}

document.getElementById('productImage').onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('thumbImg').src = ev.target.result;
    document.getElementById('previewThumb').style.display = 'block';
  };
  reader.readAsDataURL(file);
};

// Character counter for script textarea
const instructionsEl = document.getElementById('instructions');
const charCountEl = document.getElementById('charCount');
if(instructionsEl && charCountEl){
  const updateCount = () => {
    const len = instructionsEl.value.length;
    charCountEl.textContent = len + ' / 750 תווים';
    if(len > 700){
      charCountEl.style.color = '#d32f2f';
    } else if(len > 600){
      charCountEl.style.color = '#f57c00';
    } else {
      charCountEl.style.color = 'var(--muted)';
    }
  };
  instructionsEl.addEventListener('input', updateCount);
  updateCount();
}

// Caption counter
const captionEl = document.getElementById('captions');
const captionCountEl = document.getElementById('captionCount');
if(captionEl && captionCountEl){
  const updateCaptionCount = () => {
    const len = captionEl.value.length;
    captionCountEl.textContent = len + ' / 50 תווים';
    if(len > 45){
      captionCountEl.style.color = '#d32f2f';
    } else {
      captionCountEl.style.color = 'var(--muted)';
    }
  };
  captionEl.addEventListener('input', updateCaptionCount);
  updateCaptionCount();
}

async function generateScript(){
  const product = document.getElementById('productName').value.trim();
  if(!product){
    alert('נא להזין שם מוצר/נושא כדי ליצור תסריט');
    return;
  }
  const audience = document.getElementById('productUrl').value.trim();
  const style = template.style;
  const duration = template.duration;
  const status = document.getElementById('status');
  status.textContent = 'יוצר תסריט אוטומטי...';
  try{
    const r = await fetch('/api/script/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({product, audience, style, duration, language: 'he'})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'שגיאה');
    document.getElementById('instructions').value = d.script || '';
    status.textContent = '✓ תסריט נוצר! '+ (d.concept_name || '') + ' · ' + Math.round(d.estimated_duration || duration) + ' שניות · ' + (d.scenes || 3) + ' סצנות';
  }catch(err){
    status.textContent = 'שגיאה: ' + err.message;
  }
}

async function createVideo(){
  const name = document.getElementById('productName').value.trim() || 'מוצר לדוגמה';
  const instructions = document.getElementById('instructions').value.trim();
  const fileInput = document.getElementById('productImage');
  const status = document.getElementById('status');
  const btn = document.getElementById('createBtn');
  status.textContent = 'יוצר סרטון...';
  btn.disabled = true;

  const arEffects = Array.from(document.querySelectorAll('input[name="ar_effects"]:checked')).map(cb => cb.value);

  const buildPayload = (imageDataUrl) => ({
    image_data_url: imageDataUrl,
    product: name,
    style: template.style,
    duration: template.duration,
    script: instructions,
    creator: document.getElementById('avatarSelect').value,
    captions: document.getElementById('captions').value.trim(),
    music: document.getElementById('musicSelect').value,
    ar_effects: JSON.stringify(arEffects),
    audience: document.getElementById('productUrl').value.trim(),
    language: 'he',
    platform: 'אנכי · 9:16'
  });

  const submit = async (payload) => {
    const r = await fetch('/api/generations', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'שגיאה ביצירה');
    status.innerHTML = '✓ הסרטון נוצר בהצלחה! <a href="' + (d.video_url || '#') + '" target="_blank">צפו בסרטון</a>';

    const preview = document.getElementById('arPreview');
    function updateArPreview(){
      if(!preview) return;
      preview.innerHTML = '';
      const active = Array.from(document.querySelectorAll('input[name="ar_effects"]:checked')).map(cb => cb.value);
      if(active.length === 0){
        preview.style.display = 'none';
        return;
      }
      preview.style.display = 'block';
      const overlay = document.createElement('div');
      overlay.className = 'ar-overlay';
      active.forEach(effect => {
        const div = document.createElement('div');
        div.className = 'ar-' + effect + ' float';
        overlay.appendChild(div);
      });
      preview.appendChild(overlay);
    }
    const arCheckboxes = document.querySelectorAll('input[name="ar_effects"]');
    if(arCheckboxes.length){
      arCheckboxes.forEach(cb => cb.addEventListener('change', updateArPreview));
      updateArPreview();
    }

    if(arEffects.length > 0 && d.video_url){
      const videoContainer = document.createElement('div');
      videoContainer.style.cssText = 'position:relative;display:inline-block;margin-top:12px;border-radius:12px;overflow:hidden';
      videoContainer.innerHTML = '<video src="' + d.video_url + '" controls autoplay loop></video>';
      const overlay = document.createElement('div');
      overlay.className = 'ar-overlay';
      arEffects.forEach(effect => {
        const div = document.createElement('div');
        div.className = 'ar-' + effect;
        overlay.appendChild(div);
      });
      videoContainer.appendChild(overlay);
      status.appendChild(videoContainer);
    }
    btn.disabled = false;
  };

  try{
    if(fileInput.files[0]){
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try{
          await submit(buildPayload(ev.target.result));
        }catch(err){
          status.textContent = 'שגיאה: ' + err.message;
          btn.disabled = false;
        }
      };
      reader.readAsDataURL(fileInput.files[0]);
    }else{
      await submit(buildPayload(''));
    }
  }catch(err){
    status.textContent = 'שגיאה: ' + err.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
