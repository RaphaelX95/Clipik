<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יצירת סרטון - קליפיק</title>
<style>
:root{--bg:#e8f5e9;--white:#fff;--ink:#1b3a1f;--muted:#4a6b4f;--line:#c8e6c9;--lime:#25D366;--green:#075e54;--shadow:0 8px 28px #29301b0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}
.wrap{max-width:860px;margin:auto;padding:28px 18px}
.tpl-banner{background:linear-gradient(135deg,#075e54,#25D366);color:#fff;border-radius:16px;padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tpl-banner h2{margin:0;font-size:18px}
.tpl-banner p{margin:4px 0 0;opacity:.95;font-size:13px}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 4px 14px #0000000a;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:bold;margin-bottom:6px;font-size:13px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:0;border-radius:12px;background:var(--lime);color:var(--ink);font-weight:bold;cursor:pointer}
.btn.primary{background:var(--green);color:#fff}
.back{display:inline-block;margin-bottom:14px;color:var(--green);text-decoration:none;font-weight:bold}
.hint{background:#f5f7f1;border:1px solid #e5e9dc;border-radius:10px;padding:12px;font-size:12px;color:#3f453a;line-height:1.6;margin-top:8px}
.hint strong{display:block;margin-bottom:4px;color:#2a3026}

@media (max-width: 768px) {
  .wrap { padding: 20px 14px; }
  .tpl-banner { padding: 16px; }
  .tpl-banner h2 { font-size: 16px; }
  .card { padding: 16px; }
  .field input, .field select, .field textarea { font-size: 16px; padding: 12px; }
  .btn { width: 100%; padding: 12px; font-size: 14px; min-height: 44px; }
  .back { padding: 10px 14px; font-size: 13px; }
}

</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="/templates.html">← חזור לתבניות</a>
    <div class="tpl-banner" id="tplBanner">
      <div>
        <h2 id="tplTitle">תבנית</h2>
        <p id="tplDesc">הגדירו את פרטי הסרטון לפי התבנית שבחרתם.</p>
      </div>
      <button class="btn" onclick="document.getElementById('createForm').scrollIntoView({behavior:'smooth'})">התחילו עכשיו</button>
    </div>

    <div class="card" id="createForm">
      <div class="field">
        <label for="productName">שם המוצר / נושא</label>
        <input id="productName" type="text" placeholder="למשל: סטארטאפ טקטוני, מכנסי גברים, שתיית קלים">
      </div>
      <div class="field">
        <label for="productUrl">קישור למוצר <small style="color:var(--muted)">(אופציונלי)</small></label>
        <input id="productUrl" type="url" placeholder="https://yourstore.com/products/...">
      </div>
      <div class="field">
        <label for="productImage">תמונת מוצר <small style="color:var(--muted)">(PNG/JPG)</small></label>
        <input id="productImage" type="file" accept="image/png,image/jpeg">
        <div id="previewThumb" style="margin-top:8px;display:none"><img id="thumbImg" style="width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></div>
      </div>
      <div class="field">
        <label for="avatarSelect">דמות מדברת</label>
        <select id="avatarSelect" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)">
          <option value="דמות AI">דמות AI כללית</option>
          <option value="קריינות">קריין חיצוני (ללא דמות)</option>
          <option value="אדם/ה">אדם/ה מקומי</option>
          <option value="צעיר/ה">צעיר/ה YG</option>
          <option value="מבוגר/ה">מבוגר/ה מנוסה</option>
        </select>
      </div>
      <div class="field">
        <label for="captions">כתוביות בסוף הסרטון <small style="color:var(--muted)">(אופציונלי, עד 50 תווים)</small></label>
        <input id="captions" type="text" maxlength="50" placeholder="למשל: קליפיק - צרו סרטונים בעברית" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)">
        <div id="captionCount" style="text-align:left;font-size:11px;color:var(--muted);margin-top:4px">0 / 50 תווים</div>
      </div>
      <div class="field">
        <label for="instructions">הנחיות למחולל <small style="color:var(--muted)">(עד 750 תווים)</small></label>
        <textarea id="instructions" maxlength="750" placeholder="תארו בפירוט מה אתם רוצים שיהיה בסרטון: סביבה, תאורה, אפקטים, אנימציות, קריאה לפעולה וכו'"></textarea>
        <div class="hint" id="templateHint"></div>
        <div id="charCount" style="text-align:left;font-size:11px;color:var(--muted);margin-top:4px">0 / 750 תווים</div>
      </div>
      <button class="btn" style="background:#fff;color:var(--green);border:2px solid var(--green);margin-bottom:10px" onclick="generateScript()">✨ צור תסריט אוטומטי</button>
      <button class="btn primary" id="createBtn" onclick="createVideo()">✳ צרו תצוגת סרטון</button>
      <p id="status" style="margin-top:10px;color:var(--muted);font-size:12px"></p>
    </div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const template = {
  name: params.get('name') || 'סרטון מותאם',
  style: params.get('style') || 'UGC טבעי',
  duration: params.get('duration') || '15',
  hint: params.get('hint') || ''
};

document.getElementById('tplTitle').textContent = 'תבנית: ' + template.name;
document.getElementById('tplDesc').textContent = 'סגנון: ' + template.style + ' · ' + template.duration + ' שניות';
if(template.hint){
  const el = document.getElementById('templateHint');
  el.innerHTML = '<strong>💡 טיפ לפי התבנית</strong>' + template.hint;
}

document.getElementById('productImage').onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('thumbImg').src = ev.target.result;
    document.getElementById('previewThumb').style.display = 'block';
  };
  reader.readAsDataURL(file);
};

// Character counter for script textarea
const instructionsEl = document.getElementById('instructions');
const charCountEl = document.getElementById('charCount');
if(instructionsEl && charCountEl){
  const updateCount = () => {
    const len = instructionsEl.value.length;
    charCountEl.textContent = len + ' / 750 תווים';
    if(len > 700){
      charCountEl.style.color = '#d32f2f';
    } else if(len > 600){
      charCountEl.style.color = '#f57c00';
    } else {
      charCountEl.style.color = 'var(--muted)';
    }
  };
  instructionsEl.addEventListener('input', updateCount);
  updateCount();
}

// Caption counter
const captionEl = document.getElementById('captions');
const captionCountEl = document.getElementById('captionCount');
if(captionEl && captionCountEl){
  const updateCaptionCount = () => {
    const len = captionEl.value.length;
    captionCountEl.textContent = len + ' / 50 תווים';
    if(len > 45){
      captionCountEl.style.color = '#d32f2f';
    } else {
      captionCountEl.style.color = 'var(--muted)';
    }
  };
  captionEl.addEventListener('input', updateCaptionCount);
  updateCaptionCount();
}

async function generateScript(){
  const product = document.getElementById('productName').value.trim();
  if(!product){
    alert('נא להזין שם מוצר/נושא כדי ליצור תסריט');
    return;
  }
  const audience = document.getElementById('productUrl').value.trim();
  const style = template.style;
  const duration = template.duration;
  const status = document.getElementById('status');
  status.textContent = 'יוצר תסריט אוטומטי...';
  try{
    const r = await fetch('/api/script/generate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({product, audience, style, duration, language: 'he'})
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'שגיאה');
    document.getElementById('instructions').value = d.script || '';
    status.textContent = '✓ תסריט נוצר! '+ (d.concept_name || '') + ' · ' + Math.round(d.estimated_duration || duration) + ' שניות · ' + (d.scenes || 3) + ' סצנות';
  }catch(err){
    status.textContent = 'שגיאה: ' + err.message;
  }
}

async function createVideo(){
  const name = document.getElementById('productName').value.trim() || 'מוצר לדוגמה';
  const instructions = document.getElementById('instructions').value.trim();
  const fileInput = document.getElementById('productImage');
  const status = document.getElementById('status');
  const btn = document.getElementById('createBtn');
  status.textContent = 'יוצר סרטון...';
  btn.disabled = true;

  const form = new FormData();
  form.append('product', name);
  form.append('style', template.style);
  form.append('duration', template.duration);
  form.append('script', instructions);
  form.append('creator', document.getElementById('avatarSelect').value);
  form.append('captions', document.getElementById('captions').value.trim());
  if(fileInput.files[0]) form.append('image', fileInput.files[0]);

  try{
    const r = await fetch('/api/generations', {method:'POST', body: form});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error || 'שגיאה ביצירה');
    status.innerHTML = '✓ הסרטון נוצר בהצלחה! <a href="' + (d.video_url || '#') + '" target="_blank">צפו בסרטון</a>';
    btn.disabled = false;
  }catch(err){
    status.textContent = 'שגיאה: ' + err.message;
    btn.disabled = false;
  }
}
</script>
</body>
</html>
