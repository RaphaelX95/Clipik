<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תשלום בוצע בהצלחה</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 50px 16px; margin: 0; }
    h1 { color: #075e54; }
    .balance { font-size: 28px; font-weight: bold; margin: 24px 0; }
    .status { color: #333; font-size: 18px; }
    a { color: #25D366; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <h1>✓ תשלום בוצע בהצלחה!</h1>
  <p class="status" id="status">מעדכנים את היתרה שלכם...</p>
  <p class="balance">יתרה: <span id="balance">—</span> טוקנים</p>
  <p><a href="/pricing.html">למחירון</a> · <a href="/">חזרה לאתר הראשי</a></p>
<script>
(async function () {
  const balanceEl = document.getElementById('balance');
  const statusEl = document.getElementById('status');
  let start = null;
  for (let i = 0; i < 30; i++) {
    try {
      const r = await fetch('/api/users/me', { credentials: 'same-origin' });
      if (r.status === 401) { statusEl.textContent = 'התחברו לאתר כדי לראות את היתרה.'; return; }
      const d = await r.json();
      const tokens = Number((d.user && d.user.tokens) || 0);
      balanceEl.textContent = tokens;
      if (start === null) start = tokens;
      if (tokens !== start) { statusEl.textContent = 'הטוקנים נוספו לחשבונכם.'; return; }
    } catch (e) { /* ננסה שוב */ }
    await new Promise(res => setTimeout(res, 2000));
  }
  statusEl.textContent = 'הטוקנים יתווספו בעוד מספר דקות. רעננו את העמוד מאוחר יותר.';
})();
</script>
</body>
</html>
