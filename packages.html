<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>חבילות טוקנים - קליפיק | מחירון סרטוני AI</title>
<meta name="description" content="סרטון ראשון במבצע 9.99 ש״ח. חבילות 3/5/10 סרטונים, סטארטאפ, סטנדרט, פרימיום ואולטרה.">
<meta name="keywords" content="חבילות טוקנים, מחירון, סרטוני מוצרים, UGC, AI, בינה מלאכותית, קליפיק, Shopify, טיקטוק, רילס">
<link rel="canonical" href="/packages.html">
<meta property="og:title" content="חבילות טוקנים - קליפיק">
<meta property="og:description" content="חבילות טוקנים ליצירת סרטוני AI. סרטון ראשון במבצע 9.99 ש״ח!">
<meta property="og:type" content="website">
<meta property="og:url" content="/packages.html">
<link rel="stylesheet" href="/styles.css"><script>
document.querySelectorAll('.buy-btn').forEach(btn => {
    btn.onclick = async () => {
        const packageId = btn.dataset.package;
        const amount = parseFloat(btn.dataset.amount || '0');
        btn.disabled = true;
        btn.textContent = 'מעביר...';
        
        // Free trial - just activate without payment
        if (packageId === 'trial' && amount === 0) {
            try {
                const r = await fetch('/api/icount/create-payment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({package_id: packageId, amount: 0, user_id: 'demo-user', email: 'trial@local'})
                });
                const d = await r.json();
                if (d.ok) {
                    alert('סרטון ראשון במבצע 9.99 ש״ח! ' + (d.tokens_added || 6) + ' טוקנים הופעלו.');
                    btn.textContent = 'הופעל ✓';
                    setTimeout(() => window.location.reload(), 1500);
                } else {
                    alert('שגיאה: ' + (d.error || 'לא הצלחנו להפעיל את החבילה'));
                    btn.disabled = false;
                    btn.textContent = 'התחילו בחינם';
                }
            } catch (e) {
                alert('שגיאה: ' + e.message);
                btn.disabled = false;
                btn.textContent = 'התחילו בחינם';
            }
            return;
        }
        
        let email = '';
        const storedEmail = localStorage.getItem('clipic_email');
        if (storedEmail) {
            email = storedEmail;
        } else {
            email = prompt('הכניסו כתובת אימייל לקבל קבלה ולעדכן טוקנים:\n(האימייל יישמר עבור קניות עתידיות)');
            if (email === null) {
                btn.disabled = false;
                btn.textContent = 'קנו עכשיו';
                return;
            }
            email = email.trim();
            if (!email || !email.includes('@')) {
                alert('נא להכניס כתובת אימייל תקינה');
                btn.disabled = false;
                btn.textContent = 'קנו עכשיו';
                return;
            }
            localStorage.setItem('clipic_email', email);
        }
        try {
            const r = await fetch('/api/icount/create-payment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({package_id: packageId, amount: amount, user_id: 'demo-user', email: email})
            });
            const d = await r.json();
            if (d.redirect_url) {
                window.location.href = d.redirect_url;
            } else {
                alert('שגיאה: ' + (d.error || 'לא הצלחנו ליצור תשלום'));
                btn.disabled = false;
                btn.textContent = 'קנו עכשיו';
            }
        } catch (e) {
            alert('שגיאה: ' + e.message);
            btn.disabled = false;
            btn.textContent = 'קנו עכשיו';
        }
    };
});
</script>
</body>
</html>
