<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יצירת דף מוצר - קליפיק</title>
<style>
:root{--bg:#e8f5e9;--white:#fff;--ink:#1b3a1f;--muted:#4a6b4f;--line:#c8e6c9;--lime:#25D366;--green:#075e54;--shadow:0 8px 28px #29301b0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}
.wrap{max-width:1100px;margin:auto;padding:30px 20px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.head h1{margin:0;font-size:26px}
.back{background:var(--green);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px #0000000a}
.card h3{margin:0 0 12px;font-size:18px}
.field{margin-bottom:14px}
.field label{display:block;font-weight:bold;margin-bottom:6px;font-size:13px}
.field input,.field textarea,.field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;color:var(--ink)}
.field textarea{min-height:80px;resize:vertical}
.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--lime);color:var(--ink);font-weight:bold;cursor:pointer;font-size:14px}
.preview{border:1px dashed var(--line);border-radius:14px;padding:18px;background:#fafdfb;min-height:200px}
.preview h2{margin:0 0 8px;font-size:22px;color:var(--green)}
.preview .price{font-size:20px;font-weight:800;color:var(--lime);margin:8px 0}
.preview .desc{color:var(--muted);line-height:1.6;margin:8px 0}
.preview .meta{font-size:11px;color:#888;margin-top:12px}
.template-selector{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px}
.tpl-card{border:2px solid var(--line);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:.15s;background:var(--white)}
.tpl-card:hover{border-color:var(--lime);transform:translateY(-2px)}
.tpl-card.selected{border-color:var(--green);background:#f5f9f5}
.tpl-card .icon{font-size:28px;margin-bottom:6px}
.tpl-card .name{font-size:13px;font-weight:bold}
.sections{display:grid;gap:10px;margin-top:14px}
.section-row{display:flex;gap:10px;align-items:center;padding:10px;background:#f5f7f1;border-radius:10px;border:1px solid var(--line)}
.section-row input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font:inherit}
.section-row button{background:#d32f2f;color:#fff;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:12px}
.char-count{text-align:left;font-size:11px;color:var(--muted);margin-top:4px}
@media(max-width:768px){.wrap{padding:20px 14px}.grid{grid-template-columns:1fr}.head{flex-direction:column;gap:10px}.head h1{font-size:22px}}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div><h1>✨ יצירת דף מוצר</h1></div>
      <button class="back" onclick="window.location.href='/'">← חזור לסטודיו</button>
    </div>

    <div class="template-selector">
      <div class="tpl-card selected" onclick="selectTemplate(this, 'ecommerce')">
        <div class="icon">🛍️</div>
        <div class="name">חנות סטנדרט</div>
      </div>
      <div class="tpl-card" onclick="selectTemplate(this, 'landing')">
        <div class="icon">🎯</div>
        <div class="name">דף נחיתה</div>
      </div>
      <div class="tpl-card" onclick="selectTemplate(this, 'minimal')">
        <div class="icon">✨</div>
        <div class="name">מינימליסט</div>
      </div>
      <div class="tpl-card" onclick="selectTemplate(this, 'social')">
        <div class="icon">📱</div>
        <div class="name">שיווק ברשתות</div>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <h3>📝 פרטי המוצר</h3>
        <div class="field">
          <label for="productTitle">שם המוצר *</label>
          <input id="productTitle" type="text" placeholder="למשל: מכנסי גברים אופנתיים" oninput="updatePreview()">
        </div>
        <div class="field">
          <label for="productPrice">מחיר *</label>
          <input id="productPrice" type="text" placeholder="₪199" oninput="updatePreview()">
        </div>
        <div class="field">
          <label for="productDesc">תיאור קצר *</label>
          <textarea id="productDesc" maxlength="300" placeholder="תארו את המוצר ב-2-3 שורות..." oninput="updatePreview()"></textarea>
          <div class="char-count" id="descCount">0 / 300 תווים</div>
        </div>
        <div class="field">
          <label for="productFull">תיאור מלא</label>
          <textarea id="productFull" maxlength="1500" placeholder="תיאור מפורט: משתני מוצר, יתרונות, איך משתמשים..." oninput="updatePreview()"></textarea>
          <div class="char-count" id="fullCount">0 / 1500 תווים</div>
        </div>
        <div class="field">
          <label for="productImage">תמונת מוצר</label>
          <input id="productImage" type="file" accept="image/png,image/jpeg" onchange="previewImage(event)">
          <div id="thumbPreview" style="margin-top:8px;display:none"><img id="thumbImg" style="width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line)"></div>
        </div>

        <h3 style="margin-top:18px;margin-bottom:12px">🎯 יתרונות מרכזיים</h3>
        <div id="benefitsList"></div>
        <button class="btn" style="background:#fff;color:var(--green);border:2px solid var(--green);margin-top:8px" onclick="addBenefit()">+ הוסף יתרון</button>

        <h3 style="margin-top:18px;margin-bottom:12px">❓ שאלות נפוצות</h3>
        <div id="faqList"></div>
        <button class="btn" style="background:#fff;color:var(--green);border:2px solid var(--green);margin-top:8px" onclick="addFaq()">+ הוסף שאלה</button>

        <button class="btn primary" style="margin-top:18px;background:var(--green);color:#fff" onclick="generatePage()">✨ צרו דף מוצר</button>
        <p id="status" style="margin-top:10px;color:var(--muted);font-size:12px"></p>
      </div>

      <div class="preview" id="preview">
        <h2 id="prevTitle">שם המוצר</h2>
        <div class="price" id="prevPrice">₪0</div>
        <div class="desc" id="prevDesc">תיאור קצר של המוצר יופיע כאן...</div>
        <div id="prevImage" style="margin:12px 0;display:none"><img id="prevImg" style="max-width:100%;border-radius:12px;max-height:300px;object-fit:cover"></div>
        <div id="prevBenefits" style="margin:12px 0"></div>
        <div id="prevFaq" style="margin-top:16px"></div>
        <div class="meta">תצוגה מקדימה • עדכון אוטומטי</div>
      </div>
    </div>
  </div>

<script>
let selectedTemplate = 'ecommerce';
let benefits = [];
let faqs = [];

function selectTemplate(el, tpl){
  document.querySelectorAll('.tpl-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  selectedTemplate = tpl;
  updatePreview();
}

function previewImage(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    document.getElementById('thumbImg').src = ev.target.result;
    document.getElementById('thumbPreview').style.display = 'block';
    updatePreview();
  };
  reader.readAsDataURL(file);
}

function addBenefit(){
  const id = Date.now();
  const container = document.getElementById('benefitsList');
  const row = document.createElement('div');
  row.className = 'section-row';
  row.innerHTML = `<input placeholder="יתרון מרתק..." oninput="updatePreview()"><button onclick="this.parentElement.remove();updatePreview()">✕</button>`;
  container.appendChild(row);
}

function addFaq(){
  const container = document.getElementById('faqList');
  const row = document.createElement('div');
  row.className = 'section-row';
  row.innerHTML = `<input placeholder="שאלה..." oninput="updatePreview()"><button onclick="this.parentElement.remove();updatePreview()">✕</button>`;
  container.appendChild(row);
}

function updatePreview(){
  const title = document.getElementById('productTitle').value || 'שם המוצר';
  const price = document.getElementById('productPrice').value || '₪0';
  const desc = document.getElementById('productDesc').value || 'תיאור קצר של המוצר יופיע כאן...';
  const img = document.getElementById('thumbImg').src;

  document.getElementById('prevTitle').textContent = title;
  document.getElementById('prevPrice').textContent = price;
  document.getElementById('prevDesc').textContent = desc;

  const prevImg = document.getElementById('prevImage');
  if(img && img.includes('data:')){
    document.getElementById('prevImg').src = img;
    prevImg.style.display = 'block';
  }

  // Benefits
  const benefits = Array.from(document.querySelectorAll('#benefitsList input')).map(i => i.value).filter(Boolean);
  const benefitsHtml = benefits.length ? '<strong>יתרונות:</strong><ul style="margin:6px 0;padding-right:20px">' + benefits.map(b => `<li>${b}</li>`).join('') + '</ul>' : '';
  document.getElementById('prevBenefits').innerHTML = benefitsHtml;

  // FAQ
  const faqs = Array.from(document.querySelectorAll('#faqList input')).map(i => i.value).filter(Boolean);
  const faqHtml = faqs.length ? '<strong>שאלות נפוצות:</strong><ul style="margin:6px 0;padding-right:20px">' + faqs.map(f => `<li>${f}</li>`).join('') + '</ul>' : '';
  document.getElementById('prevFaq').innerHTML = faqHtml;

  // Char counts
  const descEl = document.getElementById('productDesc');
  const fullEl = document.getElementById('productFull');
  if(descEl){
    document.getElementById('descCount').textContent = descEl.value.length + ' / 300 תווים';
  }
  if(fullEl){
    document.getElementById('fullCount').textContent = fullEl.value.length + ' / 1500 תווים';
  }
}

function generatePage(){
  const title = document.getElementById('productTitle').value.trim();
  const price = document.getElementById('productPrice').value.trim();
  const desc = document.getElementById('productDesc').value.trim();
  const full = document.getElementById('productFull').value.trim();
  const imgData = document.getElementById('thumbImg').src;

  if(!title || !price || !desc){
    alert('נא למלא שם מוצר, מחיר ותיאור קצר');
    return;
  }

  const benefits = Array.from(document.querySelectorAll('#benefitsList input')).map(i => i.value).filter(Boolean);
  const faqs = Array.from(document.querySelectorAll('#faqList input')).map(i => i.value).filter(Boolean);

  const payload = {
    title, price, desc, full, benefits, faqs,
    template: selectedTemplate,
    image: imgData.includes('data:') ? imgData : null
  };

  fetch('/api/product-page', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(payload)
  }).then(r => r.json()).then(d => {
    if(d.html){
      const blob = new Blob([d.html], {type: 'text/html'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (title || 'product') + '.html';
      a.click();
      document.getElementById('status').textContent = '✓ דף המוצר נוצר! קובץ הורד אוטומטית.';
    } else {
      document.getElementById('status').textContent = 'שגיאה: ' + (d.error || 'לא ידוע');
    }
  }).catch(err => {
    document.getElementById('status').textContent = 'שגיאה: ' + err.message;
  });
}

// Init counts
updatePreview();
</script>
</body>
</html>
