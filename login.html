<main class="main-content">
  <div class="login-wrap">
    <section class="login-card" aria-labelledby="login-title">
      <div id="guestView">
        <h1 id="login-title" class="login-title">התחברות</h1>
        <p class="login-sub">מזינים אימייל ונכנסים. בלי סיסמה ובלי הרשמה נפרדת.</p>

        <p id="loginMsg" class="login-msg" role="alert" hidden></p>

        <form id="emailForm" class="email-form" novalidate>
          <label for="emailInput" class="email-label">כתובת אימייל</label>
          <input id="emailInput" class="email-input" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required>
          <button id="emailBtn" class="btn btn-primary btn-large" type="submit">שלחו לי קוד</button>
        </form>
        <form id="codeForm" class="email-form" novalidate hidden>
          <p class="login-sub" style="margin:0"><span id="codeTo"></span> שלחנו קוד בן 6 ספרות.</p>
          <label for="codeInput" class="email-label">קוד ההתחברות</label>
          <input id="codeInput" class="email-input code-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" required>
          <button id="codeBtn" class="btn btn-primary btn-large" type="submit">התחברו</button>
          <button id="resendBtn" class="btn btn-secondary" type="button">שלחו קוד חדש</button>
        </form>
      </div>

      <div id="memberView" hidden>
        <div class="login-ok" aria-hidden="true">✓</div>
        <h1 class="login-title">התחברתם</h1>
        <p class="login-sub">מחוברים כ-<strong id="memberEmail"></strong></p>
        <div class="login-actions">
          <a class="btn btn-primary btn-large" href="/create.html">ליצירת סרטון</a>
          <a class="btn btn-secondary btn-large" href="/api/auth/logout">התנתקו</a>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<style>
.login-wrap{display:flex;justify-content:center;padding:32px 0 64px}
.login-card{width:100%;max-width:440px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:36px 28px;box-shadow:0 1px 2px rgba(20,22,26,.04);text-align:center}
.login-title{font-family:var(--display);font-size:30px;font-weight:600;margin:0 0 10px;line-height:1.15}
.login-sub{color:var(--muted);font-size:15px;line-height:1.6;margin:0 0 22px}
.login-sub strong{color:var(--ink)}
.login-msg{background:#fdecea;color:#9b1c1c;border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 18px}
.login-ok{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);font-size:28px;font-weight:800;display:flex;align-items:center;justify-content:center}
.login-actions{display:flex;flex-direction:column;gap:10px}
.email-form{display:flex;flex-direction:column;gap:10px;text-align:right}
.email-form[hidden]{display:none}
.email-label{font-size:14px;font-weight:600;color:var(--ink)}
.email-input{width:100%;padding:14px 16px;border:1px solid #d0d5dd;border-radius:12px;font:inherit;font-size:16px;direction:ltr;text-align:left;background:#fff}
.email-input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:transparent}
.email-form .btn{width:100%}
.code-input{text-align:center;letter-spacing:.4em;font-size:22px;font-weight:700}
.login-actions .btn{width:100%;text-align:center}
</style>
<script>
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}

(function () {
  const msgs = {
    email_failed: 'ההתחברות נכשלה. נסו שוב.'
  };
  const err = new URLSearchParams(location.search).get('error');
  if (err && msgs[err]) {
    const el = document.getElementById('loginMsg');
    el.textContent = msgs[err];
    el.hidden = false;
  }

  const emailForm = document.getElementById('emailForm');
  const codeForm = document.getElementById('codeForm');
  const msg = document.getElementById('loginMsg');
  let pendingEmail = '';

  function showMsg(text) { msg.textContent = text; msg.hidden = false; }
  function postJson(url, body) {
    return fetch(url, {
      method: 'POST',
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(r => r.json().then(d => ({ ok: r.ok, d: d })));
  }

  function requestCode(email) {
    return postJson('/api/auth/email/request', { email: email }).then(res => {
      if (!res.ok) throw new Error(res.d.error || 'שליחת הקוד נכשלה. נסו שוב.');
      pendingEmail = email;
      document.getElementById('codeTo').textContent = email;
      emailForm.hidden = true;
      codeForm.hidden = false;
      document.getElementById('codeInput').focus();
    });
  }

  emailForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const input = document.getElementById('emailInput');
    const btn = document.getElementById('emailBtn');
    const email = input.value.trim();
    msg.hidden = true;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      showMsg('נא להזין כתובת אימייל תקינה');
      input.focus();
      return;
    }
    btn.disabled = true;
    requestCode(email)
      .catch(err => showMsg(err.message))
      .finally(() => { btn.disabled = false; });
  });

  document.getElementById('resendBtn').addEventListener('click', function () {
    msg.hidden = true;
    requestCode(pendingEmail).catch(err => showMsg(err.message));
  });

  codeForm.addEventListener('submit', function (e) {
    e.preventDefault();
    const code = document.getElementById('codeInput').value.replace(/\s/g, '');
    const btn = document.getElementById('codeBtn');
    msg.hidden = true;
    if (!/^\d{6}$/.test(code)) {
      showMsg('הקוד צריך להיות 6 ספרות');
      return;
    }
    btn.disabled = true;
    postJson('/api/auth/email/verify', { email: pendingEmail, code: code })
      .then(res => {
        if (!res.ok) throw new Error(res.d.error || 'ההתחברות נכשלה. נסו שוב.');
        location.href = '/create.html';
      })
      .catch(err => showMsg(err.message))
      .finally(() => { btn.disabled = false; });
  });

  fetch('/api/auth/me', { credentials: 'same-origin' })
    .then(r => (r.ok ? r.json() : null))
    .then(d => {
      if (!d) return;
      document.getElementById('guestView').hidden = true;
      document.getElementById('memberEmail').textContent = d.email || 'חשבון';
      document.getElementById('memberView').hidden = false;
    })
    .catch(() => { /* אם השרת לא זמין, מציגים את מסך ההתחברות */ });
})();
</script>
<script>
(function () {
  var cta = document.querySelector('.sidebar-login-cta');
  if (!cta) return;
  var box = document.createElement('div');
  box.id = 'sidebar-balance';
  box.style.cssText = 'text-align:center;margin:-8px 16px 18px;font-size:15px;font-weight:700;color:#444';
  box.textContent = 'טוקנים: 0';
  cta.insertAdjacentElement('afterend', box);
  fetch('/api/users/me', { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) { if (d && d.user) box.textContent = 'טוקנים: ' + Number(d.user.tokens || 0); })
    .catch(function () {});
})();
</script>
</body>
