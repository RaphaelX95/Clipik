<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תבניות סרטונים - קליפיק</title>
<link rel="stylesheet" href="/styles.css"><script>
function useTemplate(style, name, duration){
  const hint = {
    'הדגמת מוצר יומיומית': 'השתמשו בתאורה טבעית, צלמו מהצד ולא מהקדם, והראו את המוצר בשימוש אמיתי.',
    'פתיחת חבילה מרגשת': 'התחילו עם זום קרוב על האריזה, ואז חשיפו את המוצר לאט. הוסיפו אפקטים קלים.',
    'קריינות ותקריבים': 'תמונת רקע נקייה, תקריבים חדים, וטקסט קצר שיופיע ככתוביות.',
    'מדריך קצר': 'חלקו את השימוש ל-3-4 שלבים פשוטים, עם כתוביות לכל שלב.',
    'שיתוף ברשתות': 'פחות טקסט, יותר ויזואל. פתיחה מוליכה וסיום עם קריאה לפעולה.',
    'מבצע מיוחד': 'הדגישו את ההנחה, הוסיפו תאריך, וסיימו עם "קנו עכשיו" ברור.',
    'בעיה ופתרון': 'תחילה הציגו בעיה שצריכה פתרון, אחר כך הראו את המוצר כפתרון.',
    'ביקורת ראשונה': 'דברו בגוף ראשון כקונים שחוו את המוצר - honest review.',
  };
  const url = '/create.html?name=' + encodeURIComponent(name) + '&style=' + encodeURIComponent(style) + '&duration=' + encodeURIComponent(duration || 15) + '&hint=' + encodeURIComponent(hint[name] || '');
  window.location.href = url;
}
</script>
</body>
</html>
