<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אנליטיקס - קליפיק</title>
<style>
:root{--bg:#e8f5e9;--white:#fff;--ink:#1b3a1f;--muted:#4a6b4f;--line:#c8e6c9;--lime:#25D366;--green:#075e54;--shadow:0 8px 28px #29301b0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}
.wrap{max-width:1200px;margin:auto;padding:30px 20px}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.head h1{margin:0;font-size:26px}
.back{background:var(--green);color:#fff;border:0;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px #0000000a}
.stat .label{font-size:12px;color:var(--muted);margin-bottom:6px}
.stat .value{font-size:28px;font-weight:800;color:var(--green)}
.stat .change{font-size:11px;margin-top:4px;color:#666}
.chart-card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 14px #0000000a;margin-bottom:18px}
.chart-card h3{margin:0 0 12px;font-size:16px}
.bar-wrap{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-row .name{width:120px;font-size:12px;color:var(--muted);text-align:left}
.bar-row .track{flex:1;height:10px;background:#eef4ec;border-radius:999px;overflow:hidden}
.bar-row .fill{height:100%;background:linear-gradient(90deg,#075e54,#25D366);border-radius:999px;transition:width .4s}
.bar-row .num{width:44px;text-align:left;font-size:12px;font-weight:bold}
.table{width:100%;border-collapse:collapse;margin-top:10px}
.table th,.table td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line);font-size:13px}
.table th{color:var(--muted);font-weight:bold;font-size:12px}
.table td{color:var(--ink)}
.table tr:hover td{background:#f6faf6}
.footer{text-align:center;padding:18px;color:var(--muted);font-size:12px}
@media(max-width:768px){.stats{grid-template-columns:1fr}.head{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body><script>
(function(){
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  if(!token || token !== 'YO4DfXieWO5axgFYUleauA'){
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Arial,sans-serif;background:#e8f5e9;color:#1b3a1f;text-align:center;padding:20px"><div><h1>🔒 גישה מוגבלת</h1><p>הדף הזה נגיש למנהלי האתר בלבד.</p></div></div>';
    throw new Error('Unauthorized');
  }
})();
</script>

  <div class="wrap">
    <div class="head">
      <div><h1>📊 אנליטיקס</h1></div>
      <button class="back" onclick="window.location.href='/'">← חזור לסטודיו</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">סה"כ צפיות</div>
        <div class="value" id="totalViews">0</div>
        <div class="change">+12% מהשבוע שעבר</div>
      </div>
      <div class="stat">
        <div class="label">סרטונים שנוצרו</div>
        <div class="value" id="totalVideos">0</div>
        <div class="change">+3 השבוע</div>
      </div>
      <div class="stat">
        <div class="label">הורדות דף מוצר</div>
        <div class="value" id="totalDownloads">0</div>
        <div class="change">+5 השבוע</div>
      </div>
      <div class="stat">
        <div class="label">קליקים לסרטונים</div>
        <div class="value" id="totalClicks">0</div>
        <div class="change">CTR מדומה: 4.2%</div>
      </div>
    </div>

    <div class="chart-card">
      <h3>📈 ביצועי השבוע</h3>
      <div class="bar-wrap" id="weeklyChart"></div>
    </div>

    <div class="chart-card">
      <h3>🎥 סרטונים אחרונים</h3>
      <table class="table">
        <thead><tr><th>שם</th><th>תאריך</th><th>מצב</th><th>צפיות</th></tr></thead>
        <tbody id="recentVideos"></tbody>
      </table>
    </div>

    <div class="chart-card">
      <h3>✨ דפי מוצר אחרונים</h3>
      <table class="table">
        <thead><tr><th>שם מוצר</th><th>תאריך</th><th>מחיר</th><th>הורדות</th></tr></thead>
        <tbody id="recentProducts"></tbody>
      </table>
    </div>

    <div class="footer">Klipik Analytics • אבטיפוס • נתונים מדומים</div>
  </div>

<script>
function loadAnalytics(){
  // Demo data - in production this comes from /api/analytics/summary
  const demo = {
    totalViews: 1247,
    totalVideos: 18,
    totalDownloads: 32,
    totalClicks: 486,
    weekly: [
      {day:'א',views:120,videos:2},
      {day:'ב',views:98,videos:1},
      {day:'ג',views:156,videos:3},
      {day:'ד',views:134,videos:2},
      {day:'ה',views:210,videos:4},
      {day:'ו',views:89,videos:1},
      {day:'ש',views:440,videos:5}
    ],
    recentVideos: [
      {name:'סרטון מוצר A', date:'27/10/2026', status:'הושלם', views:124},
      {name:'סרטון מוצר B', date:'26/10/2026', status:'הושלם', views:89},
      {name:'סרטון מוצר C', date:'25/10/2026', status:'מעובד', views:45}
    ],
    recentProducts: [
      {name:'מוצר אלפא', price:'₪199', date:'27/10/2026', downloads:12},
      {name:'מוצר בטא', price:'₪149', date:'26/10/2026', downloads:8},
      {name:'מוצר גאמה', price:'₪249', date:'25/10/2026', downloads:7}
    ]
  };

  document.getElementById('totalViews').textContent = demo.totalViews.toLocaleString('he-IL');
  document.getElementById('totalVideos').textContent = demo.totalVideos;
  document.getElementById('totalDownloads').textContent = demo.totalDownloads;
  document.getElementById('totalClicks').textContent = demo.totalClicks.toLocaleString('he-IL');

  const maxViews = Math.max(...demo.weekly.map(d => d.views));
  const chart = document.getElementById('weeklyChart');
  chart.innerHTML = demo.weekly.map(d => {
    const pct = Math.round((d.views / maxViews) * 100);
    return `<div class="bar-row"><div class="name">${d.day}</div><div class="track"><div class="fill" style="width:${pct}%"></div></div><div class="num">${d.views}</div></div>`
  }).join('');

  const tbody1 = document.getElementById('recentVideos');
  tbody1.innerHTML = demo.recentVideos.map(v => `<tr><td>${v.name}</td><td>${v.date}</td><td>${v.status}</td><td>${v.views}</td></tr>`).join('');

  const tbody2 = document.getElementById('recentProducts');
  tbody2.innerHTML = demo.recentProducts.map(p => `<tr><td>${p.name}</td><td>${p.date}</td><td>${p.price}</td><td>${p.downloads}</td></tr>`).join('');
}

loadAnalytics();
</script>
</body>
</html>
