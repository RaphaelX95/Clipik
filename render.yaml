services:
  - type: web
    name: clipik
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PORT
        value: 10000
      - key: FAL_KEY
        sync: false
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1
